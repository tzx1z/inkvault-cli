[package]
name = "inkvault-cli"
version = "0.2.1"
authors = ["Evgeny Inkov <me@inkov.dev>"]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.85"
description = "Terminal client for InkVault, a self-hosted password manager with end-to-end encryption and sync over XMPP"
repository = "https://github.com/tzx1z/inkvault-cli"
homepage = "https://inkov.dev"
keywords = ["password-manager", "xmpp", "cli", "e2ee", "totp"]
categories = ["command-line-utilities", "cryptography"]
# сквозной тест, CI и проверка лицензий в крейт не входят
include = ["/src", "/README.md", "/LICENSE"]

[[bin]]
name = "inkvault"
path = "src/main.rs"

[dependencies]
inkvault-core = "0.2.1"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
futures-util = "0.3"
rpassword = "7.5"
sasl = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
# ring вместо aws-lc-rs по умолчанию: для aws-lc-rs нужны cmake и долгая сборка C-кода, в том числе под musl;
# insecure-tcp - вход без TLS только на адрес loopback (тестовый Prosody), проверка в xmpp.rs
tokio-xmpp = { version = "6.0", default-features = false, features = ["starttls", "ring", "rustls-native-certs", "insecure-tcp"] }
zeroize = { version = "1.9", features = ["serde"] }

# Argon2 без оптимизаций работает в десятки раз медленнее, тесты с реальными параметрами не дождаться
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
